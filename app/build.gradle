plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'

}

android {

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    namespace 'com.shehan.automart'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.shehan.automart"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.play.services.maps
    implementation libs.firebase.messaging
    implementation libs.play.services.location
    implementation libs.litert.support.api
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation platform('com.google.firebase:firebase-bom:34.10.0')
    implementation 'com.google.firebase:firebase-analytics'

    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")

    implementation 'com.google.firebase:firebase-auth'
    implementation('com.google.firebase:firebase-firestore')

    implementation("androidx.credentials:credentials:1.3.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.3.0")
    implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")


    implementation 'com.github.bumptech.glide:glide:5.0.5'

    implementation("com.google.firebase:firebase-storage")



    // Maps SDK for Android
    implementation "com.google.android.gms:play-services-maps:20.0.0"

    //    to get current location
    implementation "com.google.android.gms:play-services-maps:20.0.0"
    implementation "com.google.android.gms:play-services-location:21.3.0"

    // payhere
    implementation 'com.github.PayHereDevs:payhere-android-sdk:v3.0.18'
    implementation 'com.google.code.gson:gson:2.8.0' // ignore if you have already added

    // notify
    implementation 'com.google.firebase:firebase-messaging'

    // retrofit - for direction api http request
    implementation("com.squareup.retrofit2:retrofit:3.0.0")

    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")
    implementation("com.squareup.retrofit2:converter-gson:3.0.0")

    implementation 'org.slf4j:slf4j-simple:1.7.25'

// Maps SDK for Android
    implementation "com.google.android.gms:play-services-maps:20.0.0"
    implementation("com.google.android.libraries.places:places:3.5.0")
    implementation("com.google.maps.android:android-maps-utils:4.1.0")
    implementation 'com.google.maps:google-maps-services:2.2.0'
}